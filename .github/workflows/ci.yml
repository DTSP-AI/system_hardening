# Generated by ~/.claude/scripts/project_verify.py ci from the verify block in CLAUDE.md.
# It runs the same checks as the local pre-push gate. Add services (a database, etc.) here if the tests need them.
name: ci
on:
  push:
    branches: [main, active-dev]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bos1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bos1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/bos1_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install
        run: |
          (cd . && npm ci)
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
